name: Publish to NuGet
on:
  push:
    tags:
      - '*.*.*'
env:
  PackageVersion: '${{ github.ref_name }}'
jobs:
  publish:
    permissions:
      id-token: write
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore NuGet packages
        run: |
          dotnet restore Mikrofin.EMoney.CashDeskSdk/Mikrofin.EMoney.CashDeskSdk.csproj
      - name: Build the project
        run: |
          dotnet build Mikrofin.EMoney.CashDeskSdk/Mikrofin.EMoney.CashDeskSdk.csproj --configuration Release --no-restore /p:Version=${{ env.PackageVersion }}
      - name: Pack the project
        run: |
          dotnet pack Mikrofin.EMoney.CashDeskSdk/Mikrofin.EMoney.CashDeskSdk.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{ env.PackageVersion }}
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Push NuGet package
        run: |
          dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}
      - name: Cleanup
        run: |
          rm -rf ./nupkg
          dotnet clean Mikrofin.EMoney.CashDeskSdk/Mikrofin.EMoney.CashDeskSdk.csproj
